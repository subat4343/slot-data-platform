code: pscube
name: "P's CUBE（台詳細）"
priority: 10
enabled: true
access_policy:
  # 約款 第5条(1) は明示的な許可のない自動取得を禁止している。運営会社の許可がある場合のみ permitted にする。
  automated_fetch: permitted
  reviewed_at: "2026-10-26"
  evidence:
    - "https://www.pscube.jp/docs/yakkan/ 第5条(1) 明示的な許可なく自動化された手段で情報を取得することを禁止"
    - "https://www.pscube.jp/robots.txt: User-agent: * Allow: /（Content-Signal: ai-train=no）"
    - "https://p-town.dmm.com/robots.txt: /shops/<pref>/<id>/jackpot は Disallow 対象外"
  # 許可の根拠。書面・メール等の所在が分かれば追記する
  permission_reference: >-
    ユーザー申告（2026-10-23）: 株式会社アンジェロより許可取得済み。
    条件: 高頻度アクセスの禁止、API 等の非公開経路の利用禁止。ブラウザ操作で人が確認する程度の頻度で、
    DMMぱちタウンの店舗ページ経由で閲覧する。
    補足（2026-10-26 ユーザー申告）: 運営側の線引きは「通常のブラウザで取得できる範囲で、人が毎晩確認して
    ノートに記録する程度の定点収集は可。毎秒アクセスなど人には不可能な頻度・データ差分の取得は不可」。
    自動操作そのものは否定されていない。
  respect_robots_txt: true
rate_limit:
  # 画面遷移の最小間隔（秒）。人が順に画面を見る程度の間隔
  min_interval_seconds: 30
  max_concurrency: 1
retry:
  max_attempts: 1
  base_delay_seconds: 5
  max_delay_seconds: 120
  timeout_seconds: 60
user_agent: "slot-data-collector/0.2"
options:
  # 画面ありで動かす
  headless: false
  # 台詳細も巡回する（1 日 1 回・30 秒間隔）。error(451) などが出たらその回の台詳細巡回は打ち切る
  crawl_details: true
