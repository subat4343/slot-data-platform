[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slot-data"
version = "0.1.0"
description = "スロットデータ収集・蓄積システム（原本保存・正規化・改訂履歴・配置管理）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "tzdata",
    "jpholiday>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
slot-data = "slot_data.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slot_data = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: PostgreSQL が必要なテスト（SLOT_DATA_TEST_DATABASE_URL）",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
